spring:
  application:
    name: raiseready2

  datasource:
    # Defaults match local Postgres, which trusts this machine (OS user, no password).
    # Override with env vars in any other environment.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/raiseready2}
    username: ${DB_USERNAME:${user.name}}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate never changes it.
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      # Cookie only: never put the session id in a URL (the redirect after the toggle would otherwise).
      tracking-modes: cookie
      cookie:
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
