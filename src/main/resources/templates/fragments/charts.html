<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  A donut chart with its table. Used for each chart on the dashboard:
    <section th:replace="~{fragments/charts :: donutCard(title=..., subtitle=..., center=..., caption=..., column=..., empty=..., segments=..., slices=..., showShare=true|false)}"></section>
  Each arc's length is its share of the whole. showShare adds a separate Share column and percentages (for money); without it the value itself is the share (for equity). Arcs too short for a label rely on the table and the tooltip.
-->
<section class="chart-card" th:fragment="donutCard(title, subtitle, center, caption, column, empty, segments, slices, showShare)">
    <h2 th:text="${title}">Title</h2>
    <p class="muted" th:text="${subtitle}">Subtitle</p>

    <p class="muted" th:if="${segments.isEmpty()}" th:text="${empty}">Nothing yet.</p>

    <div class="breakup-layout" th:unless="${segments.isEmpty()}">
        <svg class="donut" viewBox="0 0 200 200" role="group" th:aria-label="${title}">
            <g transform="rotate(-90 100 100)">
                <circle th:each="s : ${slices}" class="slice" cx="100" cy="100" r="66" fill="none" stroke-width="44" pathLength="100" tabindex="0"
                        th:style="'stroke:var(--s' + ${s.slot()} + ')'"
                        th:attr="stroke-dasharray=${s.dash()},stroke-dashoffset=${s.offset()}"
                        th:data-name="${s.label()}" th:data-amount="${s.valueText()}" th:data-share="${showShare} ? ${s.sharePct() + '%'}" th:data-extra="${s.detail()}"
                        th:aria-label="${s.label() + ': ' + s.valueText() + (showShare ? ', ' + s.sharePct() + '%' : '') + (s.detail() != null ? '. ' + s.detail() : '')}"></circle>
            </g>
            <text th:each="s : ${slices}" th:if="${s.showLabel()}" class="slice-label" text-anchor="middle" dominant-baseline="central"
                  th:x="${s.labelX()}" th:y="${s.labelY()}" th:style="'fill:var(--on' + ${s.slot()} + ')'"
                  th:text="${showShare} ? ${s.sharePct() + '%'} : ${s.valueText()}"></text>
            <text class="donut-total" x="100" y="96" text-anchor="middle" th:text="${center}"></text>
            <text class="donut-caption" x="100" y="115" text-anchor="middle" th:text="${caption}"></text>
        </svg>

        <!-- The table is the legend and the full set of values, so nothing depends on colour or hover. -->
        <table class="breakup">
            <thead>
            <tr><th th:text="${column}">Name</th><th class="num" th:text="${showShare} ? 'Amount' : 'Equity'">Amount</th><th class="num" th:if="${showShare}">Share</th></tr>
            </thead>
            <tbody>
            <tr th:each="s : ${segments}">
                <td><span class="swatch" th:classappend="'s' + ${s.slot()}"></span><span th:text="${s.label()}"></span></td>
                <td class="num" th:text="${s.valueText()}"></td>
                <td class="num" th:if="${showShare}" th:text="${s.sharePct()} + '%'"></td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="tooltip" role="status" hidden></div>
</section>
</body>
</html>
